name: CI/CD

on:
  push:
    branches: ["main", "next"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  # Kept in sync with the push branches above: a branch that can receive
  # pushes must also validate the PRs merging into it, or every PR lands with
  # no CI and the suite only runs after the merge.
  pull_request:
    branches: ["main", "next"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The plugin runs against whatever python3 the host distribution
        # ships, not one it chooses, so the floor and a current release are
        # both covered.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # No install step and no requirements file. The plugin is stdlib-only on
      # purpose -- it runs from OpenDeck's plugin directory against the host
      # interpreter, where there is nowhere to install anything to -- and a
      # dependency creeping in should fail here rather than on someone's deck.
      - name: Assert the plugin has no third-party imports
        run: |
          if grep -rnE '^\s*(import|from)\s+(requests|websockets|pydbus|dbus|gtk|PIL|cairosvg)\b' \
               systems.garcia.openwave.sdPlugin; then
            echo "::error::third-party import found; the plugin must stay stdlib-only"
            exit 1
          fi

      - name: Validate the plugin bundle
        run: python3 scripts/validate_plugin.py

      - name: Byte-compile every module
        run: python3 -m compileall -q systems.garcia.openwave.sdPlugin scripts tests

      - name: Check the launcher is a valid shell script
        run: sh -n systems.garcia.openwave.sdPlugin/run.sh

      - name: Tests
        run: python3 -m unittest discover -s tests -t . -v

      - name: Build the release archive
        run: python3 scripts/package.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.13'
        with:
          name: openwave-opendeck
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Semantic Release
    needs: [validate]
    if: >-
      github.event_name == 'push' &&
      contains(fromJson('["refs/heads/main", "refs/heads/next"]'), github.ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"

      # npm install, not npm ci: there is no lock file, because this repo has
      # no JavaScript to lock -- node exists here only to run semantic-release.
      # Every devDependency is pinned to an exact version instead, which is
      # the property a lock file would have been providing.
      - run: npm install --no-audit --no-fund


      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          # Kept in sync with the pin in package.json. Without it the action
          # uses whatever semantic-release tree it bundles, which is not the
          # one npm ci just installed the plugins for.
          semantic_version: 25.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release pushes the release commit and the tag before it
      # publishes the GitHub release, so a failure in between (a transient
      # rejection of a push, say) leaves a tag with no release and no assets.
      # A re-run cannot repair that: it sees the tag and finds nothing to
      # release. This step publishes the newest tag if it has no release, built
      # from the tag itself because the working tree is dirty after
      # semantic-release's prepare step. After a healthy run it does nothing.
      - name: Publish the latest tag if it has no release
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The repo is public, so fetching needs no credentials.
          git fetch --tags --force origin
          git fetch origin "+refs/heads/$REF_NAME:refs/remotes/origin/$REF_NAME"

          if ! tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "origin/$REF_NAME"); then
            echo "No release tag on $REF_NAME; nothing to publish."
            exit 0
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          echo "Tag $tag has no release; publishing it."
          worktree="$RUNNER_TEMP/release-$tag"
          git worktree add --detach "$worktree" "$tag"
          cd "$worktree"
          python3 scripts/package.py

          # This version's section of the changelog, from the line after its
          # heading to the line before the next version heading. Minor and
          # major releases use "# [x.y.z]" and patches "## [x.y.z]"; the
          # "### ..." sub-headings inside the section are kept.
          version=${tag#v}
          notes=$(awk -v v="$version" '
            BEGIN { h1 = "# [" v "]"; h2 = "## [" v "]" }
            /^##? \[[0-9]/ {
              if (on) exit
              if (index($0, h1) == 1 || index($0, h2) == 1) { on = 1; next }
            }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d')

          args=(--verify-tag --title "$tag")
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/notes-$tag.md"
            args+=(--notes-file "$RUNNER_TEMP/notes-$tag.md")
          else
            args+=(--generate-notes)
          fi
          case "$tag" in
            *-*) args+=(--prerelease) ;;
          esac

          # The labels match the ones in .releaserc.json. The files are
          # found first and labelled after: a glob with "#label" on the end
          # would be looking for a file whose name ends in the label.
          archive=$(ls dist/openwave-opendeck-*.zip)
          checksum=$(ls dist/openwave-opendeck-*.zip.sha256)
          gh release create "$tag" "${args[@]}" \
            "$archive#OpenDeck plugin" \
            "$checksum#SHA-256 checksum"
